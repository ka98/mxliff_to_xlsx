name: Build PyInstaller Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --onefile --name mxliff_to_xlsx-linux mxliff_to_xlsx.py

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --onefile --name mxliff_to_xlsx-macos mxliff_to_xlsx.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --name mxliff_to_xlsx-windows.exe mxliff_to_xlsx.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mxliff_to_xlsx-${{ runner.os }}
          path: |
            dist/*
  release:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mxliff_to_xlsx-Linux
          path: dist-linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mxliff_to_xlsx-Windows
          path: dist-windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mxliff_to_xlsx-macOS
          path: dist-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist-linux/*
            dist-windows/*
            dist-macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}